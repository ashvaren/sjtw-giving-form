/* Layout: a slim control bar above one live form, rendered in either the church's own style or a Google Forms style */
:root{
  --navy:#06145d; --midnavy:#3b4a85; --pink:#ff858d; --softpink:#ffd4d4; --lightblue:#c2dfe3; --tint:#eaf3f5; --white:#ffffff; --error:#b3261e;
  --gf-bg:#e7ecf4; --gf-line:#dadce0; --gf-text:#202124; --gf-sub:#5f6368; --gf-red:#d93025; --note:#fff7d6; --note-line:#e8d27a;
  --display:"Clash Display","Poppins",sans-serif; --body:"Poppins",system-ui,sans-serif; --gf:"Roboto",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--white);color:var(--navy);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.55}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* Control bar */
.bar{background:var(--navy);color:var(--white);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.bar h1{margin:0;font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2}
.bar p{margin:2px 0 0;font-size:13px;color:var(--lightblue)}
.seg{display:flex;border:1px solid var(--lightblue)}
.seg button{background:transparent;color:var(--white);border:0;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--navy)}
.reset{background:transparent;border:0;color:var(--lightblue);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}

/* ===== Own form skin ===== */
.own .site-head{background:var(--white);height:64px;display:flex;align-items:center;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.own .site-head img{height:34px;width:auto}
.own .site-head span{font-size:14px;font-weight:400;color:var(--midnavy)}
.own .banner{position:relative;height:clamp(150px,26vw,248px);background:var(--tint) center/cover no-repeat}
.own .banner h2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,70%);margin:0;text-align:center;font-family:var(--display);font-weight:600;font-size:clamp(20px,3.4vw,33px);line-height:1.14;color:var(--navy);text-wrap:balance}
.own .wrap{max-width:720px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.own .card{background:var(--white);border-top:5px solid var(--navy);padding:36px 0 0;display:flex;flex-direction:column;gap:22px}
.own .eyebrow{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--midnavy)}
.own .prog{display:flex;align-items:center;gap:14px}
.own .track{flex:1;height:6px;background:var(--softpink)}
.own .fill{height:6px;background:var(--navy);transition:width .3s}
.own .prog span{font-size:14px;font-weight:400;color:var(--midnavy);white-space:nowrap}
.own h3.title{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,36px);line-height:1.1;text-wrap:balance}
.own p{margin:0}
.own .panel{background:var(--softpink);padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.own .bank{background:var(--white);padding:14px 18px;display:grid;grid-template-columns:150px minmax(0,1fr);row-gap:6px;font-weight:400;font-variant-numeric:tabular-nums}
.own .bank dt{color:var(--midnavy)} .own .bank dd{margin:0}
.own fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.own legend{font-weight:500;font-size:18px;margin-bottom:10px;padding:0}
.own .opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--midnavy);padding:13px 16px;cursor:pointer}
.own .opt:has(input:checked){background:var(--tint);border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
input[type=radio]{appearance:none;-webkit-appearance:none;width:1.25em;height:1.25em;margin:.15em 0 0;flex-shrink:0;border:2px solid var(--navy);border-radius:50%;background:var(--white);display:grid;place-content:center;cursor:pointer}
input[type=radio]::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--navy);transform:scale(0);transition:transform .12s}
input[type=radio]:checked::before{transform:scale(1)}
@media (prefers-reduced-motion:reduce){input[type=radio]::before{transition:none}}
input[type=date]{cursor:pointer}
.own .opt small{display:block;font-size:14px;color:var(--midnavy)}
.own .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.own .field{display:flex;flex-direction:column;gap:6px;font-weight:500;min-width:0}
.own .field input,.own .money{height:48px;border:1px solid var(--midnavy);padding:0 14px;font-size:16px;color:var(--navy);background:var(--white);width:100%}
.own .money{display:flex;align-items:center;padding:0;max-width:260px}
.own .money b{padding:0 4px 0 14px;font-weight:400;color:var(--midnavy)}
.own .money input{border:0;height:46px;padding:0 10px 0 0;flex:1;min-width:0;background:transparent}
.own .short{max-width:260px}
.own .err{color:var(--error);font-size:14px;font-weight:400}
.own .invalid input,.own .invalid .money,.own .invalid .opt{border-color:var(--error)}
.own .hint{font-size:14px;color:var(--midnavy);font-weight:300}
.own .nav{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.own .btn{background:var(--navy);color:var(--white);border:0;padding:14px 32px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.own .btn.ghost{background:var(--white);color:var(--navy);border:1px solid var(--navy);padding:13px 28px}
.own .sum{display:flex;flex-direction:column}
.own .sum div{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--lightblue);align-items:baseline}
.own .sum dt{color:var(--midnavy);font-weight:400}.own .sum dd{margin:0;font-weight:400;overflow-wrap:anywhere}
.own .sum button{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;font-size:14px}
.own .callout{border-left:4px solid var(--pink);padding:4px 0 4px 16px}
@media (max-width:560px){.own .sum div{grid-template-columns:minmax(0,1fr) auto}.own .sum dt{grid-column:1/-1}.own .bank{grid-template-columns:120px minmax(0,1fr)}}

/* ===== Google Forms skin ===== */
.gf{background:var(--gf-bg);font-family:var(--gf);color:var(--gf-text);font-size:14px;line-height:1.5;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gf .col{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.gf .hdr{aspect-ratio:4/1;max-width:100%;border-radius:8px;background:var(--tint) center/cover no-repeat;position:relative;overflow:hidden}
.gf .hdr::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.04)}
.gf .c{background:var(--white);border:1px solid var(--gf-line);border-radius:8px;padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px}
.gf .c.top{border-top:10px solid var(--navy)}
.gf .c h3{margin:0;font-size:28px;font-weight:400;line-height:1.25}
.gf .sec{background:var(--navy);color:var(--white);border-radius:8px 8px 0 0;padding:8px 16px;font-size:14px;font-weight:500;margin:-23px -25px 8px;width:calc(100% + 50px)}
.gf .c h4{margin:0;font-size:20px;font-weight:400}
.gf .c p{margin:0;white-space:pre-line}
.gf .req{color:var(--gf-red)}
.gf .q{font-size:16px}
.gf .ro{display:flex;gap:12px;align-items:center;padding:6px 0;cursor:pointer}
.gf .ro input{margin:0;font-size:16px}
.gf input[type=text],.gf input[type=email],.gf input[type=date],.gf input[type=tel]{border:0;border-bottom:1px solid var(--gf-line);padding:6px 0;width:min(100%,320px);font-size:14px;background:transparent}
.gf input:focus{outline:none;border-bottom:2px solid var(--navy)}
.gf .err{color:var(--gf-red);font-size:12px;display:flex;gap:6px;align-items:center}
.gf .invalid{border-color:var(--gf-red)}
.gf .navr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gf .navr .l{display:flex;gap:8px}
.gf .b{background:var(--navy);color:var(--white);border:0;border-radius:4px;padding:9px 24px;font-weight:500;cursor:pointer}
.gf .b.w{background:var(--white);color:var(--navy);box-shadow:0 1px 2px rgba(60,64,67,.3)}
.gf .pg{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--gf-sub)}
.gf .pg i{display:block;width:120px;height:10px;background:#e0e0e0;border-radius:5px;overflow:hidden}.gf .pg i b{display:block;height:10px;background:var(--navy)}
.gf .clear{background:none;border:0;color:var(--navy);font-weight:500;cursor:pointer}
.gf .foot{text-align:center;font-size:12px;color:var(--gf-sub)}
.gf .foot strong{display:block;font-size:22px;color:var(--gf-sub);font-weight:400;margin-top:6px}
.gf .note{background:var(--note);border:1px dashed var(--note-line);border-radius:8px;padding:14px 18px;font-family:var(--body);color:var(--navy);font-size:14px;line-height:1.5}
.gf .note b{display:block;font-weight:500;margin-bottom:4px}
.gf .note ul{margin:0;padding-left:18px}
</style>

<div class="bar">
  <div class="bar-in">
    <div><h1>Giving form prototype</h1><p>Try each route. Nothing you type is sent anywhere.</p></div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div class="seg" role="group" aria-label="Show the form as">
        <button id="sk-own" type="button" aria-pressed="true">Our own form</button>
        <button id="sk-gf" type="button" aria-pressed="false">Google Forms version</button>
      </div>
      <button class="reset" id="reset" type="button">Start again</button>
    </div>
  </div>
</div>

const BANK=[["Account name","St Johns PCC"],["Sort code","55-70-13"],["Account number","03204200"],["Reference","Your full name"]];
const FUNDS=[
 {v:"General Fund",d:"Where it is most needed: the ministry, staff and running of St John's"},
 {v:"Church Family Support Fund",d:"Practical help for members of our church family in hardship"},
 {v:"Church Plant Fund",d:"Planting a new church in Paddock Wood"},
 {v:"Mission",d:"Supporting mission beyond St John's"}];
const ROUTES={
 regular:["choose","bank","you","so","ga","check","done"],
 oneoff:["choose","howpay","you","gift","ga","check","done"],
 caf:["choose","you","cafso","ga","check","done"],
 gaonly:["choose","you","ga","check","done"]};
const S={skin:"own",step:"choose",d:{},errors:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function route(){const r=ROUTES[S.d.what]||["choose"];return S.skin==="gf"?r.filter(x=>x!=="check"):r}
function idx(){return route().indexOf(S.step)}

/* ---------- field validation ---------- */
const PC=/^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i, EM=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const money=v=>/^\d+(\.\d{1,2})?$/.test(String(v||"").trim())&&Number(v)>0;
const RULES={
 choose:{what:v=>v?"":"Choose what you would like to do"},
 you:{first:v=>v?"":"Enter your first name",last:v=>v?"":"Enter your surname",addr:v=>v?"":"Enter your home address",town:v=>v?"":"Enter your town",
      pc:v=>!v?"Enter your postcode":PC.test(v)?"":"Enter a real postcode, like TN1 1YW",email:v=>!v?"Enter your email address":EM.test(v)?"":"Enter an email address like name@example.com"},
 so:{kind:v=>v?"":"Choose new or a change",amt:v=>money(v)?"":"Enter an amount in pounds, like 25 or 25.50",freq:v=>v?"":"Choose how often",start:v=>v?"":"Enter the date of the first payment"},
 cafso:{amt:v=>money(v)?"":"Enter an amount in pounds, like 25 or 25.50",freq:v=>v?"":"Choose how often",start:v=>v?"":"Enter the date of the first payment to NatWest"},
 howpay:{method:v=>v?"":"Choose how you will give"},
 gift:{amt:v=>money(v)?"":"Enter an amount in pounds, like 100",gdate:v=>v?"":"Enter the date of your gift",fund:v=>v?"":"Choose where your gift goes"},
 ga:{ga:v=>v?"":"Choose an answer"}};
function validate(step){const r=RULES[step]||{};const e={};for(const k in r){const m=r[k](String(S.d[k]??"").trim());if(m)e[k]=m}S.errors=e;return !Object.keys(e).length}

/* ---------- shared content ---------- */
const STEP_TITLE={choose:"Your giving to St John's",bank:"Set up your standing order",howpay:"How to give",you:"About you",so:"Your standing order",cafso:"Your standing order at NatWest",gift:"Your gift",ga:"Gift Aid",check:"Check your answers",done:"Thank you"};
const CHOICES=[
 ["regular","Give regularly by standing order","Regular gifts go to the General Fund"],
 ["oneoff","Make a one-off gift","You can choose which fund it goes to"],
 ["caf","I have moved my standing order from the old CAF account","Tell us so we can match it at NatWest"],
 ["gaonly","Make a Gift Aid declaration only","For gifts you already make"]];
function fmtDate(v){if(!v)return"";const d=new Date(v+"T12:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}
function gbp(v){return"£"+Number(v).toLocaleString("en-GB",{minimumFractionDigits:Number(v)%1?2:0,maximumFractionDigits:2})}
function summary(){const d=S.d,rows=[];const w=CHOICES.find(c=>c[0]===d.what);rows.push(["What you are doing",w?w[1]:"","choose"]);
 rows.push(["Name",`${d.first||""} ${d.last||""}`.trim(),"you"]);rows.push(["Home address",[d.addr,d.town,(d.pc||"").toUpperCase()].filter(Boolean).join(", "),"you"]);rows.push(["Email",d.email,"you"]);
 if(d.phone)rows.push(["Phone",d.phone,"you"]);
 if(d.what==="regular"){rows.push(["Standing order",`${gbp(d.amt)} ${d.freq.toLowerCase()}, ${d.kind==="new"?"new":"a change to an existing one"}`,"so"]);rows.push(["First payment",fmtDate(d.start),"so"]);rows.push(["Fund","General Fund","bank"])}
 if(d.what==="caf"){rows.push(["Standing order",`${gbp(d.amt)} ${d.freq.toLowerCase()}`,"cafso"]);rows.push(["First payment to NatWest",fmtDate(d.start),"cafso"])}
 if(d.what==="oneoff"){rows.push(["Gift",`${gbp(d.amt)} on ${fmtDate(d.gdate)}`,"gift"]);rows.push(["Paid by",d.method==="bank"?"Bank transfer":"Card, through the giving page","howpay"]);rows.push(["Fund",d.fund,"gift"])}
 rows.push(["Gift Aid",d.ga==="yes"?"Yes, declaration made":d.ga==="already"?"Already declared":"No","ga"]);return rows}

/* ---------- own form renderer ---------- */
function oErr(k){return S.errors[k]?`<div class="err" id="e-${k}">${esc(S.errors[k])}</div>`:""}
function oRadio(name,opts,legend){return `<fieldset class="${S.errors[name]?"invalid":""}"><legend>${legend}</legend>${oErr(name)}${opts.map(([v,l,s])=>`<label class="opt"><input type="radio" name="${name}" id="${name}-${v}" value="${esc(v)}" ${S.d[name]===v?"checked":""}><span>${esc(l)}${s?`<small>${esc(s)}</small>`:""}</span></label>`).join("")}</fieldset>`}
function oText(k,label,opt={}){return `<label class="field ${opt.cls||""} ${S.errors[k]?"invalid":""}" for="${k}">${label}${oErr(k)}<input id="${k}" name="${k}" type="${opt.type||"text"}" value="${esc(S.d[k])}" ${opt.ph?`placeholder="${opt.ph}"`:""} autocomplete="${opt.ac||"off"}"></label>`}
function oMoney(k,label){return `<label class="field ${S.errors[k]?"invalid":""}" for="${k}">${label}${oErr(k)}<span class="money"><b>£</b><input id="${k}" name="${k}" inputmode="decimal" value="${esc(S.d[k])}"></span></label>`}
function oBank(){return `<dl class="bank">${BANK.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`}
function ownBody(){const s=S.step,d=S.d;
 switch(s){
 case"choose":return `<p>Thank you for giving to St John's. This takes about three minutes.</p>${oRadio("what",CHOICES,"Choose one")}
  <p class="hint">Regular giving to the General Fund is what lets us plan: it pays for our ministry, staff and the running of the church. One-off gifts can go to a particular fund.</p>`;
 case"bank":return `<div class="panel"><div style="font-weight:500">Set up a standing order with your bank, in your banking app, online banking or at a branch.</div>${oBank()}</div>
  <p>Once you have done that, carry on here so that we can thank you and claim Gift Aid. This form does not set up the payment; only your bank can do that.</p>
  <p class="callout">Regular gifts go to the General Fund. If you would like a regular gift to support a particular fund, please speak to Simon Curtis, our Giving Secretary, first.</p>`;
 case"howpay":return `${oRadio("method",[["bank","By bank transfer"],["card","By card"]],"How will you give?")}
  ${d.method==="bank"?`<div class="panel"><div style="font-weight:500">Send your gift to:</div>${oBank()}</div>`:""}
  ${d.method==="card"?`<div class="panel"><div>Give by card on our giving page, then come back here to tell us where your gift should go.</div><div><a class="btn" href="https://www.sjtw.church/give" target="_blank" rel="noopener">Open the giving page</a></div></div>`:""}`;
 case"you":return `<p>We need your home address for Gift Aid.</p><div class="grid2">${oText("first","First name",{ac:"given-name"})}${oText("last","Surname",{ac:"family-name"})}</div>
  ${oText("addr","Home address",{ph:"House number and street",ac:"address-line1"})}<div class="grid2">${oText("town","Town",{ac:"address-level2"})}${oText("pc","Postcode",{ac:"postal-code"})}</div>
  ${oText("email","Email",{type:"email",ac:"email"})}${oText("phone","Phone (optional)",{type:"tel",ac:"tel"})}
  <p class="hint">We use these details only to look after your giving. Only our Giving Secretary and Accounts Administrator can see them.</p>`;
 case"so":return `<p>This lets us match your gift when it reaches our account.</p>${oRadio("kind",[["new","A new standing order"],["change","A change to the amount of an existing one"]],"Is this a new standing order or a change?")}
  ${oMoney("amt","Amount of each payment")}${oRadio("freq",[["Monthly","Monthly"],["Quarterly","Quarterly"],["Annually","Annually"]],"How often?")}${oText("start","Date of the first payment",{type:"date",cls:"short"})}`;
 case"cafso":return `<p>Thank you for moving your giving. These details let us match your first payment at NatWest and close your record at CAF.</p>
  ${oMoney("amt","Amount of each payment")}${oRadio("freq",[["Monthly","Monthly"],["Quarterly","Quarterly"],["Annually","Annually"]],"How often?")}${oText("start","Date of the first payment to NatWest",{type:"date",cls:"short"})}`;
 case"gift":return `${oMoney("amt","Amount of your gift")}${oText("gdate","Date of your gift",{type:"date",cls:"short"})}<p class="hint" style="margin-top:-12px">We have put in today\u2019s date. Change it if you gave on another day.</p>
  ${oRadio("fund",FUNDS.map(f=>[f.v,f.v,f.d]),"Where should your gift go?")}<p class="hint">Money given to a particular fund can only be spent on that purpose. If you are unsure, the General Fund helps the church most.</p>`;
 case"ga":{const opts=[["yes","Yes, I make the declaration above"],["no","No, not at the moment"]];if(d.what==="caf")opts.splice(1,0,["already","I have already made one to St John's"]);
  return `<p>If you are a UK taxpayer, Gift Aid adds 25p to every £1 you give, at no cost to you.</p>
  <div class="panel"><div style="font-weight:500">Gift Aid declaration</div><p>I want The Parochial Church Council of the Ecclesiastical Parish of St John, Tunbridge Wells (registered charity 1132603) to treat as Gift Aid donations all gifts I have made in the four years before this tax year, and all gifts I make from today until I tell them otherwise.</p><p>I am a UK taxpayer and understand that if I pay less Income Tax and Capital Gains Tax in the current tax year than the amount of Gift Aid claimed on all my donations, it is my responsibility to pay any difference.</p></div>
  ${oRadio("ga",opts,"Would you like to Gift Aid your giving?")}<p class="hint">Please tell us if you move house, change your name or stop paying enough tax.</p>`}
 case"check":return `<p>Please check your answers before you send them.</p><dl class="sum">${summary().map(([a,b,st])=>`<div><dt>${a}</dt><dd>${esc(b)}</dd><button type="button" data-goto="${st}">Change</button></div>`).join("")}</dl>`;
 case"done":return `<p style="font-size:18px">We are grateful for your gift, and for the time so many of you give in serving week by week.</p><p>A copy of your answers has gone to ${esc(d.email||"your email address")}.</p>
  ${d.what==="regular"?`<div class="panel"><div style="font-weight:500">Not set up your standing order yet? Here are the details again.</div>${oBank()}</div>`:""}
  ${d.what==="oneoff"&&d.method==="bank"?`<div class="panel"><div style="font-weight:500">If you have not yet sent your gift, here are the details again.</div>${oBank()}</div>`:""}
  ${d.what==="caf"?`<p>We will let you know when your first payment reaches NatWest. Please check that nothing more goes to the old CAF account.</p>`:""}
  <p>Any questions? Email Simon Curtis, our Giving Secretary, at giving@stjohnstw.org.</p><div><a class="btn" href="https://www.sjtw.church/give" target="_blank" rel="noopener">Back to the giving page</a></div>`;}
}
function renderOwn(){const r=route(),i=idx(),steps=r.filter(x=>x!=="choose"&&x!=="done").length,n=Math.max(1,i);
 const showProg=S.step!=="done";const label=S.step==="choose"?"Getting started":`Step ${n} of ${steps}`;const pct=S.step==="choose"?4:Math.round(n/steps*100);
 return `<div class="own"><div class="site-head"><img src="${LOGO}" alt="St John's Tunbridge Wells"><span>sjtw.church/give</span></div>
 <div class="banner" style="background-image:url(${BANNER})" role="img" aria-label="A vine with bunches of grapes"><h2>How to set up your standing order and Gift&nbsp;Aid</h2></div>
 <div class="wrap"><form class="card" id="f" novalidate><div style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Your giving to St John's</div>
 ${showProg?`<div class="prog"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${label}</span></div>`:""}</div>
 <h3 class="title">${S.step==="choose"?"How would you like to give?":STEP_TITLE[S.step]}</h3>${ownBody()}
 ${S.step==="done"?"":`<div class="nav">${S.step==="choose"?"<span></span>":`<button type="button" class="btn ghost" data-act="back">Back</button>`}<button type="submit" class="btn">${S.step==="check"?"Send":"Next"}</button></div>`}
 </form></div></div>`}

/* ---------- Google Forms renderer ---------- */
const GF_NOTES={
 choose:["Possible: a multiple choice question with ‘Go to section based on answer’. This is the only kind of branching Google Forms has.","Not possible: a short description under each option. The hint has to go into the option text itself."],
 bank:["Possible: bank details as plain text in the section description.","Not possible: the boxed panel, bold labels, aligned columns or a copy button."],
 howpay:["Possible: the multiple choice question.","Not possible: showing the bank details or the card button only after someone picks an option. Branching moves between sections, it cannot reveal text on the same page, so both sets of instructions would have to sit in the description."],
 you:["Possible: required questions, and response validation using a pattern for the postcode and an email check.","Not possible: two questions side by side. Every question is a full-width row, so the page gets long on a phone."],
 so:["Possible: number validation (greater than 0), a date question, multiple choice.","Not possible: a £ sign fixed inside the box, or formatting the amount as money in the responses."],
 cafso:["Possible: the same questions as the standing order section.","The CAF flag is simply the answer to the first question, so it shows in the responses sheet without extra work."],
 gift:["Possible: one fund chosen from a list, which is all a one-off gift needs.","Not possible: percentage splits that must total 100%, or a running total. That is the main reason restricting funds to one-off gifts makes Google Forms workable."],
 ga:["Possible: the declaration text in the section description and a Yes or No question. Google records the date and time of every response, which with the name and address gives the electronic record HMRC accepts.","Not possible: a ‘check your answers’ page. Google Forms submits straight from the last section, so this route ends here."],
 done:["Possible: one confirmation message for everyone, and an emailed copy of the answers to the donor.","Not possible: a thank you page that changes with the route, repeats the bank details in a panel, or has a button back to the website. A short link can go in the text."]};
function gErr(k){return S.errors[k]?`<div class="err">ⓘ ${esc(S.errors[k])}</div>`:""}
function gQ(k,title,inner,req=true){return `<div class="c ${S.errors[k]?"invalid":""}" style="${S.errors[k]?"border-color:var(--gf-red)":""}"><div class="q">${title} ${req?'<span class="req">*</span>':""}</div>${inner}${gErr(k)}</div>`}
function gRadio(k,title,opts,req=true){return gQ(k,title,opts.map(([v,l])=>`<label class="ro"><input type="radio" name="${k}" id="${k}-${v}" value="${esc(v)}" ${S.d[k]===v?"checked":""}>${esc(l)}</label>`).join(""),req)}
function gText(k,title,type="text",req=true){return gQ(k,title,`<input id="${k}" name="${k}" type="${type}" value="${esc(S.d[k])}" placeholder="Your answer">`,req)}
const bankTxt="Account name: St Johns PCC\nSort code: 55-70-13\nAccount number: 03204200\nReference: your full name";
function gSec(title,desc){const r=route(),i=idx();return `<div class="c"><div class="sec">Section ${i+1} of ${r.length-1}</div><h4>${title}</h4>${desc?`<p>${desc}</p>`:""}</div>`}
function gfBody(){const s=S.step,d=S.d;
 switch(s){
 case"choose":return gRadio("what","What would you like to do?",CHOICES.map(c=>[c[0],c[1]+(c[0]==="regular"?" (goes to the General Fund)":c[0]==="oneoff"?" (you can choose the fund)":"")]));
 case"bank":return gSec("Set up your standing order","Set up a standing order with your bank, in your banking app, online banking or at a branch.\n\n"+bankTxt+"\n\nThis form does not set up the payment. Regular gifts go to the General Fund. To support a particular fund regularly, please speak to Simon Curtis first.");
 case"howpay":return gSec("How to give","By bank transfer:\n"+bankTxt+"\n\nBy card: use the giving page at sjtw.church/give, then come back to this form.")+gRadio("method","How will you give?",[["bank","By bank transfer"],["card","By card"]]);
 case"you":return gSec("About you","We need your home address for Gift Aid. Only our Giving Secretary and Accounts Administrator can see these details.")+gText("first","First name")+gText("last","Surname")+gText("addr","Home address")+gText("town","Town")+gText("pc","Postcode")+gText("email","Email","email")+gText("phone","Phone","tel",false);
 case"so":return gSec("Your standing order","This lets us match your gift when it reaches our account.")+gRadio("kind","Is this a new standing order or a change?",[["new","A new standing order"],["change","A change to the amount of an existing one"]])+gText("amt","Amount of each payment (£)")+gRadio("freq","How often?",[["Monthly","Monthly"],["Quarterly","Quarterly"],["Annually","Annually"]])+gText("start","Date of the first payment","date");
 case"cafso":return gSec("Your standing order at NatWest","Thank you for moving your giving.")+gText("amt","Amount of each payment (£)")+gRadio("freq","How often?",[["Monthly","Monthly"],["Quarterly","Quarterly"],["Annually","Annually"]])+gText("start","Date of the first payment to NatWest","date");
 case"gift":return gSec("Your gift","Money given to a particular fund can only be spent on that purpose. If you are unsure, the General Fund helps the church most.")+gText("amt","Amount of your gift (£)")+gText("gdate","Date of your gift (today\u2019s date is filled in)","date")+gRadio("fund","Where should your gift go?",FUNDS.map(f=>[f.v,f.v+": "+f.d.charAt(0).toLowerCase()+f.d.slice(1)]));
 case"ga":{const o=[["yes","Yes, I make the declaration above"],["no","No, not at the moment"]];if(d.what==="caf")o.splice(1,0,["already","I have already made one to St John's"]);
  return gSec("Gift Aid","If you are a UK taxpayer, Gift Aid adds 25p to every £1 you give, at no cost to you.\n\nI want The Parochial Church Council of the Ecclesiastical Parish of St John, Tunbridge Wells (registered charity 1132603) to treat as Gift Aid donations all gifts I have made in the four years before this tax year, and all gifts I make from today until I tell them otherwise.\n\nI am a UK taxpayer and understand that if I pay less Income Tax and Capital Gains Tax in the current tax year than the amount of Gift Aid claimed on all my donations, it is my responsibility to pay any difference.")+gRadio("ga","Would you like to Gift Aid your giving?",o)}
 case"done":return `<div class="c"><h3 style="font-size:24px">Giving to St John's</h3><p>Thank you. We are grateful for your gift, and for the time so many of you give in serving week by week. A copy of your answers has been emailed to you. Any questions: giving@stjohnstw.org</p><p><button type="button" class="clear" data-act="reset" style="padding:0">Submit another response</button></p></div>`;}
}
function renderGf(){const r=route(),i=idx(),last=S.step===r[r.length-2];const notes=GF_NOTES[S.step]||[];const tot=r.length-1;
 const top=S.step==="done"?"":`<div class="c top"><h3>Giving to St John's</h3><p>How to set up your standing order and Gift Aid. This takes about three minutes.</p><div style="border-top:1px solid var(--gf-line);margin:6px -24px 0;padding:10px 24px 0;font-size:13px;color:var(--gf-sub)"><span class="req">*</span> Indicates required question</div></div>`;
 return `<div class="gf"><form class="col" id="f" novalidate><div class="hdr" style="background-image:url(${BANNER})" role="img" aria-label="Header image: a vine with bunches of grapes"></div>${top}${gfBody()}
 ${S.step==="done"?"":`<div class="navr"><div class="l">${S.step==="choose"?"":`<button type="button" class="b w" data-act="back">Back</button>`}<button type="submit" class="b">${last?"Submit":"Next"}</button></div><div class="pg"><i><b style="width:${Math.round((i+1)/tot*100)}%"></b></i>Page ${i+1} of ${S.step==="choose"?"?":tot}</div><button type="button" class="clear" data-act="reset">Clear form</button></div>`}
 <div class="foot">Never submit passwords through Google Forms.<br>This content is neither created nor endorsed by Google.<strong>Google Forms</strong></div>
 ${notes.length?`<div class="note"><b>What Google Forms can and cannot do on this page</b><ul>${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}</form></div>`}

/* ---------- control ---------- */
function render(focusErr){$("#app").innerHTML=S.skin==="own"?renderOwn():renderGf();
 $("#sk-own").setAttribute("aria-pressed",S.skin==="own");$("#sk-gf").setAttribute("aria-pressed",S.skin==="gf");
 if(focusErr){const k=Object.keys(S.errors)[0];const el=k&&(document.getElementById(k)||document.querySelector(`[name="${k}"]`));if(el){el.focus({preventScroll:true});el.closest(".c,.field,fieldset")?.scrollIntoView({block:"center",behavior:"smooth"})}}}
function go(step){if(step==="gift"&&!S.d.gdate){const t=new Date();S.d.gdate=new Date(t.getTime()-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)}S.step=step;S.errors={};render();const a=$("#app");if(a.getBoundingClientRect().top<0)a.scrollIntoView({behavior:"smooth"})}
document.addEventListener("input",e=>{const t=e.target;if(t.name&&t.closest("#f")){S.d[t.name]=t.value;if(S.errors[t.name]){delete S.errors[t.name]}
 if(t.type==="radio"&&(t.name==="method"||t.name==="what")){if(t.name==="what"){delete S.errors.what}render()}}});
document.addEventListener("submit",e=>{if(e.target.id!=="f")return;e.preventDefault();
 if(!validate(S.step)){render(true);return}const r=route();go(r[idx()+1])});
document.addEventListener("click",e=>{const di=e.target.closest('input[type=date]');if(di){try{di.showPicker()}catch(_){}}const b=e.target.closest("[data-act],[data-goto]");if(!b)return;
 if(b.dataset.goto){go(b.dataset.goto);return}
 if(b.dataset.act==="back"){const r=route();go(r[Math.max(0,idx()-1)])}
 if(b.dataset.act==="reset"){S.d={};go("choose")}});
$("#sk-own").onclick=()=>{S.skin="own";if(!route().includes(S.step))S.step="ga";S.errors={};render()};
$("#sk-gf").onclick=()=>{S.skin="gf";if(S.step==="check")S.step="ga";S.errors={};render()};
$("#reset").onclick=()=>{S.d={};go("choose")};
/* opens on a filled example so the first view shows the form at work */
S.d={first:"Example",last:"Donor",addr:"1 Example Road",town:"Tunbridge Wells",pc:"TN1 1YW",email:"example@example.com"};
render();
</script>
</body></html>
